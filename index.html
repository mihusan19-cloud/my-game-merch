<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>遊戲周邊比價查詢系統</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>周邊查詢模板</h2>
    
    <div class="field">
        <label>角色名</label>
        <select id="charName">
            <option value="花里實乃理">花里實乃理 (Minori)</option>
            <option value="宵崎奏">宵崎奏 (Kanade)</option>
            <option value="曉山瑞希">曉山瑞希 (Mizuki)</option>
        </select>
    </div>

    <div class="field">
        <label>周邊類型</label>
        <select id="itemType">
            <option value="卡面ePick金簽">卡面 ePick 金簽</option>
            <option value="卡面厚磚">卡面厚磚</option>
            <option value="徽章">徽章 (缶バッジ)</option>
        </select>
    </div>

    <div class="field">
        <label>第幾彈 / 柄圖名稱 (手動輸入)</label>
        <input type="text" id="series" placeholder="例如: DP 或 vol.1">
    </div>

    <button onclick="generateQuery()">生成查詢資訊</button>

    <div id="result">
        <strong>生成的商品名稱：</strong><br>
        <span id="outputName"></span><br><br>
        <strong>台灣市場計算方式：</strong><br>
        <span>採樣邏輯：眾數 (Mode)</span>
    </div>
</div>

<script>
    function generateQuery() {
        const char = document.getElementById('charName').value;
        const type = document.getElementById('itemType').value;
        const series = document.getElementById('series').value;
        
        // 組合命名模板
        const fullName = `${char}-${type}-${series}`;
        
        document.getElementById('outputName').innerText = fullName;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
