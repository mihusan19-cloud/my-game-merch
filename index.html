<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界計畫社團行情比價</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; position: relative; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 50px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .field { margin-bottom: 20px; display: none; } 
        #field-char { display: block; } 
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: #fff; }
        button#submitBtn { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; display: none; }
        button#submitBtn:hover { background-color: #2980b9; }
        #result { margin-top: 25px; padding: 20px; background-color: #e8f4fd; border-left: 5px solid #3498db; border-radius: 4px; display: none; }
        .price-tag { font-size: 1.5em; color: #e74c3c; font-weight: bold; margin: 10px 0; }
        .copy-btn { padding: 4px 8px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; margin-left: 10px; }
        .info-footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .info-footer p { font-size: 14px; color: #777; line-height: 1.8; margin: 0; }
        .version-tag { position: fixed; bottom: 10px; left: 15px; font-size: 12px; color: #ccc; user-select: none; }
        
        /* 小助手樣式 */
        .chat-widget { position: fixed; bottom: 40px; right: 20px; cursor: pointer; z-index: 1000; }
        .chat-widget img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #3498db; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .chat-modal { display: none; position: fixed; bottom: 110px; right: 20px; width: 300px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1001; padding: 20px; }
        .chat-modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .chat-modal-links a { display: block; color: #3498db; text-decoration: none; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>PJSK 社團行情查詢</h2>
    
    <div class="field" id="field-char">
        <label>1. 選擇角色或團體</label>
        <select id="charName" onchange="updateFlow('char')">
            <option value="">請選擇...</option>
        </select>
    </div>

    <div class="field" id="field-type">
        <label>2. 周邊類型</label>
        <select id="itemType" onchange="updateFlow('type')">
            <option value="">請選擇類型...</option>
        </select>
    </div>

    <div class="field" id="field-miku-type">
        <label>選擇版本</label>
        <select id="mikuVersion" onchange="updateFlow('miku')">
            <option value="">請選擇...</option>
            <option value="好蔥">好蔥</option>
            <option value="壞蔥">壞蔥</option>
        </select>
    </div>

    <div class="field" id="field-series">
        <label id="seriesLabel">3. 第幾彈 / 例如: vol.1</label>
        <select id="seriesSelect" onchange="updateFlow('series')">
            <option value="">請選擇彈數...</option>
        </select>
    </div>

    <div class="field" id="field-flower">
        <label>選擇分類</label>
        <select id="flowerType" onchange="updateFlow('flower')">
            <option value="">請選擇...</option>
        </select>
    </div>

    <div class="field" id="field-box">
        <label id="boxLabel">分盒/特典</label>
        <select id="boxType" onchange="updateFlow('box')">
            <option value="">請選擇分盒/特典...</option>
        </select>
    </div>

    <button id="submitBtn" onclick="generateQuery()">查詢社團行情</button>

    <div id="result">
        <strong>查詢商品：</strong><br>
        <span id="outputName" style="font-weight: bold; color: #2c3e50;"></span>
        <button class="copy-btn" onclick="copyName()">複製名稱回報</button>
        <div id="priceOutput" class="price-tag">NT$ ---</div>
        <div id="dataCount" style="font-size: 0.8em; color: #666;"></div>
    </div>

    <div class="info-footer">
        <p>
            4. 感謝プロセカ週邊圖鑑授權使用以及原汁原味芒果協助整理資料。<br>
            5. 再販商品請斟酌參考
        </p>
    </div>
</div>

<div class="chat-widget" onclick="toggleChat()"><img src="chat-icon.jpg" alt="小助手"></div>
<div class="chat-modal" id="chatModal">
    <div class="chat-modal-header"><h4>小助手通知</h4><span onclick="toggleChat()" style="cursor:pointer">×</span></div>
    <div class="chat-modal-content">
        感謝大家協助回報價格。<br><br>
        由於目前是測試階段，只會有最基本的使用，部分內容會在之後新增及優化。<br><br>
        目前以「第幾彈」為主，避免中文稱呼多樣導致數據龐大。
        <div class="chat-modal-links">
            <a href="https://forms.gle/29PwP13TMj6GaU9L7" target="_blank">💡 優化建議</a>
            <a href="https://forms.gle/ifimYn8sdVZ84PCm9" target="_blank">🐛 Bug 回報</a>
        </div>
    </div>
</div>

<div class="version-tag">Beta v1.3.0</div>

<script>
function toggleChat() {
    const m = document.getElementById('chatModal');
    m.style.display = (m.style.display === 'block') ? 'none' : 'block';
}

const characters = ["Virtual Singer", "Leo/need", "MORE MORE JUMP!", "Vivid BAD SQUAD", "Wonderlands×Showtime", "25點，Nightcord見", "初音未來", "鏡音鈴", "鏡音連", "巡音流歌", "MEIKO", "KAITO", "星乃一歌", "天馬咲希", "望月穗波", "日野森志步", "花里實乃理", "桐谷遙", "桃井愛莉", "日野森雫", "小豆澤心羽", "白石杏", "東雲彰人", "青柳冬彌", "天馬司", "鳳笑夢", "草薙寧寧", "神代類", "宵崎奏", "朝比奈真冬", "東雲繪名", "曉山瑞希"];
const groups = ["Virtual Singer", "Leo/need", "MORE MORE JUMP!", "Vivid BAD SQUAD", "Wonderlands×Showtime", "25點，Nightcord見"];

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvXxis5JLRyEbv0lSyEzbf03bG9uutyGOKmxLnno3x0ys-PSidWLUQlWpwEPPynURj0QPtxtSjRZrz/pub?output=csv";
let marketData = [];

function updateFlow(step) {
    const char = document.getElementById('charName').value;
    const type = document.getElementById('itemType').value;
    const mikuV = document.getElementById('mikuVersion').value;
    const hide = (ids) => ids.forEach(id => document.getElementById(id).style.display = 'none');

    if (step === 'char') {
        hide(['field-type', 'field-series', 'field-miku-type', 'field-flower', 'field-box', 'submitBtn']);
        if (char) {
            const typeSelect = document.getElementById('itemType');
            typeSelect.innerHTML = '<option value="">請選擇類型...</option>';
            let list = [];
            if (groups.includes(char)) {
                list = ["2024感謝祭", "2025感謝祭", "劇場版"];
            } else {
                list = ["卡面ePick一組", "卡面ePick金簽", "卡面厚磚", "徽章", "色紙", "其他卡面徽章", "活動牌", "2024感謝祭小卡", "2025感謝祭小卡", "劇場版"];
            }
            list.forEach(t => { let o = document.createElement('option'); o.value = t; o.text = t; typeSelect.appendChild(o); });
            document.getElementById('field-type').style.display = 'block';
        }
    } 
    else if (step === 'type') {
        hide(['field-series', 'field-miku-type', 'field-flower', 'field-box', 'submitBtn']);
        if (type === "劇場版") {
            if (char === "初音未來") {
                document.getElementById('field-miku-type').style.display = 'block';
            } else if (groups.includes(char)) {
                updateBoxOptions("劇場版團體");
                document.getElementById('field-box').style.display = 'block';
            } else {
                updateFlowerOptions("劇場版一般");
                document.getElementById('field-flower').style.display = 'block';
            }
        } else if (type.includes("感謝祭小卡")) {
            updateFlowerOptions("小卡");
            document.getElementById('field-flower').style.display = 'block';
        } else if (groups.includes(char)) {
            document.getElementById('submitBtn').style.display = 'block';
        } else {
            updateSeriesOptions(type);
            document.getElementById('field-series').style.display = 'block';
        }
    }
    else if (step === 'miku') {
        hide(['field-flower', 'field-box', 'submitBtn']);
        if (mikuV) {
            updateFlowerOptions(mikuV === "好蔥" ? "劇場版好蔥" : "劇場版壞蔥");
            document.getElementById('field-flower').style.display = 'block';
        }
    }
    else if (step === 'series') {
        hide(['field-flower', 'field-box', 'submitBtn']);
        if (type === '色紙') {
            updateFlowerOptions("色紙");
            document.getElementById('field-flower').style.display = 'block';
        } else if (type === '卡面厚磚' || type === '活動牌') {
            updateBoxOptions(type);
            document.getElementById('field-box').style.display = 'block';
        } else {
            updateBoxOptions(type);
            document.getElementById('field-box').style.display = 'block';
        }
    }
    else if (step === 'flower') {
        document.getElementById('submitBtn').style.display = (document.getElementById('flowerType').value) ? 'block' : 'none';
        if (type === "劇場版" || type.includes("感謝祭小卡")) {
            document.getElementById('submitBtn').style.display = 'block';
        }
    }
    else if (step === 'box') {
        document.getElementById('submitBtn').style.display = (document.getElementById('boxType').value) ? 'block' : 'none';
    }
}

function updateSeriesOptions(type) {
    const s = document.getElementById('seriesSelect');
    s.innerHTML = '<option value="">請選擇彈數...</option>';
    let max = 66;
    if (type.includes("ePick") || type === "徽章") {
        const births = ["2022生日系列", "2023生日系列", "2024生日系列", "2023創作者祭", "2024創作者祭(超會議)", "2025創作者祭(超會議)"];
        births.forEach(b => { let o = document.createElement('option'); o.value = b; o.text = b; s.appendChild(o); });
    }
    if (type.includes("ePick")) max = 26;
    else if (type === "卡面厚磚") max = 72;
    else if (type === "徽章") max = 50;
    else if (type === "色紙") max = 59;
    else if (type === "活動牌") max = 18;
    for (let i = 1; i <= max; i++) { let o = document.createElement('option'); o.value = `vol.${i}`; o.text = `vol.${i}`; s.appendChild(o); }
}

function updateFlowerOptions(mode) {
    const f = document.getElementById('flowerType');
    f.innerHTML = '<option value="">請選擇...</option>';
    let opts = [];
    if (mode === "色紙") opts = ["特訓前", "特訓後"];
    else if (mode === "小卡") opts = ["普卡", "燙金"];
    else if (mode === "劇場版一般" || mode === "劇場版好蔥") opts = ["徽章", "入場特典色紙"];
    else if (mode === "劇場版壞蔥") opts = ["ePick普卡", "ePick簽卡", "ePick特典", "徽章", "入場特典色紙", "劇場版羈絆牌(白蔥和壞蔥)"];
    
    opts.forEach(v => { let o = document.createElement('option'); o.value = v; o.text = v; f.appendChild(o); });
}

function updateBoxOptions(type) {
    const b = document.getElementById('boxType');
    b.innerHTML = '<option value="">請選擇分盒/特典...</option>';
    let opts = ["無分盒 (直接查詢)"];
    if (type === "活動牌") opts = ["A", "B"];
    else if (type === "其他卡面徽章") opts = ["A", "B", "特典A盒", "特典B盒"];
    else if (type === "徽章" || type.includes("ePick")) opts = ["A", "B", "C", "無分盒"];
    else if (type === "劇場版團體") opts = ["特典"];

    opts.forEach(v => { let o = document.createElement('option'); o.value = v; o.text = v; b.appendChild(o); });
}

function generateQuery() {
    const char = document.getElementById('charName').value;
    const type = document.getElementById('itemType').value;
    const series = document.getElementById('seriesSelect').value;
    const flower = document.getElementById('flowerType').value;
    const box = document.getElementById('boxType').value;
    const mikuV = document.getElementById('mikuVersion').value;

    let parts = [char, type];
    if (mikuV) parts.push(mikuV);
    if (series) parts.push(series);
    if (flower) parts.push(flower);
    if (box && box !== "無分盒 (直接查詢)") parts.push(box);
    
    let fullName = parts.join('-');
    document.getElementById('outputName').innerText = fullName;
    const pOut = document.getElementById('priceOutput');
    const dOut = document.getElementById('dataCount');

    const prices = marketData.filter(i => i.name === fullName && !isNaN(i.price)).map(i => i.price);
    if (prices.length > 0) {
        const modeMap = {}; let max = 0, mode = prices[0];
        prices.forEach(p => { modeMap[p] = (modeMap[p] || 0) + 1; if(modeMap[p] > max) { max = modeMap[p]; mode = p; } });
        pOut.innerText = `NT$ ${mode}`;
        dOut.innerText = `(根據 ${prices.length} 筆回報計算)`;
    } else {
        pOut.innerText = "NT$ ---"; dOut.innerText = "(目前尚無回報數據)";
    }
    document.getElementById('result').style.display = 'block';
}

function copyName() {
    navigator.clipboard.writeText(document.getElementById('outputName').innerText);
    alert("已複製名稱！");
}

async function loadData() {
    try {
        const res = await fetch(csvUrl);
        const data = await res.text();
        const rows = data.split('\n').slice(1);
        marketData = rows.map(r => { const c = r.split(','); return { name: c[1]?.trim(), price: parseInt(c[2]?.trim()) }; });
    } catch (e) { console.error("載入失敗"); }
}

const charSelect = document.getElementById('charName');
characters.forEach(n => { let o = document.createElement('option'); o.value = n; o.text = n; charSelect.appendChild(o); });
loadData();
</script>
</body>
</html>
