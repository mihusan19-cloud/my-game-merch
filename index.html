<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界計畫社團行情比價</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        
        .field { margin-bottom: 20px; display: none; } /* 初始隱藏 */
        #field-char { display: block; } /* 僅顯示第一步 */
        
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: #fff; }
        
        button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; display: none; }
        button:hover { background-color: #2980b9; }
        
        #result { margin-top: 25px; padding: 20px; background-color: #e8f4fd; border-left: 5px solid #3498db; border-radius: 4px; display: none; }
        .price-tag { font-size: 1.5em; color: #e74c3c; font-weight: bold; margin: 10px 0; }
        .report-link { display: inline-block; margin-top: 15px; color: #3498db; text-decoration: none; font-size: 0.9em; border: 1px solid #3498db; padding: 5px 10px; border-radius: 4px; }
        .info-footer { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; font-size: 14px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h2>PJSK 社團行情查詢</h2>
    
    <div class="field" id="field-char">
        <label>1. 選擇角色或團體</label>
        <select id="charName" onchange="updateFlow('char')">
            <option value="">請選擇...</option>
        </select>
    </div>

    <div class="field" id="field-type">
        <label>2. 周邊類型</label>
        <select id="itemType" onchange="updateFlow('type')">
            <option value="">請選擇類型...</option>
        </select>
    </div>

    <div class="field" id="field-series">
        <label id="seriesLabel">3. 第幾彈</label>
        <select id="seriesSelect" onchange="updateFlow('series')">
            <option value="">請選擇彈數...</option>
        </select>
    </div>

    <div class="field" id="field-flower">
        <label>4. 選擇特訓狀態</label>
        <select id="flowerType" onchange="updateFlow('flower')">
            <option value="">請選擇...</option>
            <option value="特訓前">特訓前 (花前)</option>
            <option value="特訓後">特訓後 (花後)</option>
        </select>
    </div>

    <div class="field" id="field-box">
        <label id="boxLabel">5. 分盒/特典</label>
        <select id="boxType" onchange="updateFlow('box')">
            <option value="">無分盒 (直接查詢)</option>
        </select>
    </div>

    <button id="submitBtn" onclick="generateQuery()">查詢社團行情</button>

    <div id="result">
        <strong>查詢商品：</strong><br>
        <span id="outputName" style="font-weight: bold;"></span><br>
        <div id="priceOutput" class="price-tag">讀取中...</div>
        <div id="dataCount" style="font-size: 0.8em; color: #666; margin-bottom: 10px;"></div>
        <div style="font-size: 0.85em; color: #666; border-top: 1px solid #ccc; padding-top: 10px;">
            💡 <strong>數據邏輯：</strong> 採計臉書社團成交「眾數」，排除盜版低價干擾，再販商品不適用。
        </div>
        <a href="https://forms.gle/B1sVgEYxoWWRusv87" target="_blank" class="report-link">➕ 我要回報成交價</a>
    </div>

    <div class="info-footer">
        <h3>📌 使用小提醒</h3>
        <p>1. 查詢時請確保選單選項正確。<br>2. 價格僅供參考，實際交易請以社團為準。</p>
    </div>
</div>

<script>
// 角色清單加入團體
const characters = [
    "Virtual Singer", "Leo/need", "MORE MORE JUMP!", "Vivid BAD SQUAD", "Wonderlands×Showtime", "25點，Nightcord見",
    "初音未來", "鏡音鈴", "鏡音連", "巡音流歌", "MEIKO", "KAITO", "星乃一歌", "天馬咲希", "望月穗波", "日野森志步", 
    "花里實乃理", "桐谷遙", "桃井愛莉", "日野森雫", "小豆澤心羽", "白石杏", "東雲彰人", "青柳冬彌", "天馬司", 
    "鳳笑夢", "草薙寧寧", "神代類", "宵崎奏", "朝比奈真冬", "東雲繪名", "曉山瑞希"
];

const itemTypes = [
    "卡面ePick一組", "卡面ePick金簽", "卡面厚磚", "徽章", "色紙", "壓克力立牌", "吊飾", "其他卡面徽章", "活動牌", "坐姿娃娃"
];

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvXxis5JLRyEbv0lSyEzbf03bG9uutyGOKmxLnno3x0ys-PSidWLUQlWpwEPPynURj0QPtxtSjRZrz/pub?output=csv";
let marketData = [];

// 控制流程邏輯
function updateFlow(step) {
    const type = document.getElementById('itemType').value;
    const char = document.getElementById('charName').value;
    
    // 重置後續隱藏
    const hideFrom = (idList) => idList.forEach(id => document.getElementById(id).style.display = 'none');

    if (step === 'char' && char) {
        document.getElementById('field-type').style.display = 'block';
    } 
    else if (step === 'type') {
        hideFrom(['field-series', 'field-flower', 'field-box', 'submitBtn']);
        if (type) {
            updateSeriesOptions(type);
            document.getElementById('field-series').style.display = 'block';
        }
    } 
    else if (step === 'series') {
        hideFrom(['field-flower', 'field-box', 'submitBtn']);
        if (type === '色紙') {
            document.getElementById('field-flower').style.display = 'block';
        } else {
            updateBoxOptions(type);
            // 厚磚無分盒，直接出按鈕
            if (type === '卡面厚磚') {
                document.getElementById('submitBtn').style.display = 'block';
            } else {
                document.getElementById('field-box').style.display = 'block';
            }
        }
    }
    else if (step === 'flower') {
        updateBoxOptions(type);
        document.getElementById('field-box').style.display = 'block';
    }
    else if (step === 'box') {
        document.getElementById('submitBtn').style.display = 'block';
    }
}

// 動態彈數範圍
function updateSeriesOptions(type) {
    const seriesSelect = document.getElementById('seriesSelect');
    seriesSelect.innerHTML = '<option value="">請選擇彈數...</option>';
    let maxVol = 66; // 預設

    if (type.includes("ePick")) maxVol = 26;
    else if (type === "卡面厚磚") maxVol = 72;
    else if (type === "徽章") maxVol = 50;
    else if (type === "色紙") maxVol = 59;
    else if (type === "壓克力立牌") maxVol = 30;
    else if (type === "吊飾") maxVol = 21;
    else if (type === "其他卡面徽章") maxVol = 10;
    else if (type === "活動牌") maxVol = 18;

    document.getElementById('seriesLabel').innerText = `3. 第幾彈 (範圍 vol.1~vol.${maxVol})`;
    for (let i = 1; i <= maxVol; i++) {
        let opt = document.createElement('option');
        opt.value = `vol.${i}`; opt.innerHTML = `vol.${i}`;
        seriesSelect.appendChild(opt);
    }
}

// 動態分盒選項
function updateBoxOptions(type) {
    const boxSelect = document.getElementById('boxType');
    boxSelect.innerHTML = '<option value="">無分盒 (直接查詢)</option>';
    
    let options = [];
    if (type === "活動牌") options = ["A", "B"];
    else if (type === "其他卡面徽章") options = ["A", "B", "特典"];
    else if (type !== "卡面厚磚") options = ["A", "B", "C"];

    options.forEach(optVal => {
        let opt = document.createElement('option');
        opt.value = optVal; opt.innerHTML = `${optVal} 盒`;
        boxSelect.appendChild(opt);
    });
}

function generateQuery() {
    const char = document.getElementById('charName').value;
    const type = document.getElementById('itemType').value;
    const series = document.getElementById('seriesSelect').value;
    const flower = document.getElementById('flowerType').value;
    const box = document.getElementById('boxType').value;

    // 組合全名：角色-類型-彈數(-花前後)(-分盒)
    let parts = [char, type, series];
    if (type === '色紙' && flower) parts.push(flower);
    if (box) parts.push(box);
    
    let fullName = parts.join('-');
    document.getElementById('outputName').innerText = fullName;
    
    const prices = marketData
        .filter(item => item.name === fullName && !isNaN(item.price))
        .map(item => item.price);

    const priceOutput = document.getElementById('priceOutput');
    const dataCount = document.getElementById('dataCount');

    if (prices.length > 0) {
        const modeMap = {}; let maxCount = 0, modePrice = prices[0];
        prices.forEach(p => {
            modeMap[p] = (modeMap[p] || 0) + 1;
            if(modeMap[p] > maxCount) { maxCount = modeMap[p]; modePrice = p; }
        });
        priceOutput.innerText = `NT$ ${modePrice}`;
        dataCount.innerText = `(根據 ${prices.length} 筆回報計算)`;
    } else {
        priceOutput.innerText = "NT$ ---";
        dataCount.innerText = "(目前尚無回報數據)";
    }
    document.getElementById('result').style.display = 'block';
}

async function loadData() {
    try {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = data.split('\n').slice(1); 
        marketData = rows.map(row => {
            const cols = row.split(',');
            return { name: cols[1]?.trim(), price: parseInt(cols[2]?.trim()) };
        });
    } catch (e) { console.error("載入失敗", e); }
}

function setup() {
    const charSelect = document.getElementById('charName');
    const itemSelect = document.getElementById('itemType');
    characters.forEach(n => { let o = document.createElement('option'); o.value = n; o.innerHTML = n; charSelect.appendChild(o); });
    itemTypes.forEach(t => { let o = document.createElement('option'); o.value = t; o.innerHTML = t; itemSelect.appendChild(o); });
}

setup();
loadData();
</script>
</body>
</html>
